name: Build and deploy Software4Techs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_TOOLBOX_CHECKOUT: ${{ vars.TOOLBOX_CHECKOUT || 'https://whop.com/checkout/plan_LdLvG8DAe9Wyk/' }}
          NEXT_PUBLIC_IPOS_CHECKOUT: ${{ vars.IPOS_CHECKOUT || 'https://whop.com/checkout/plan_xia6DlUhPX5i1/' }}
      - uses: actions/upload-artifact@v4
        with:
          name: storefront
          path: out/
          retention-days: 7
  deploy:
    if: github.repository == 'belliez/Software4techs' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: software4techs-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: storefront
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global firebase-tools@15.37.0
      - uses: google-github-actions/auth@v3
        with:
          project_id: software4techs
          service_account: storefront-deploy@software4techs.iam.gserviceaccount.com
          workload_identity_provider: projects/486565825420/locations/global/workloadIdentityPools/storefront/providers/github
      - name: Resolve the storefront Analytics stream
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
        run: python3 scripts/analytics-config.py
      - name: Publish current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            firebase deploy --only hosting --project software4techs --non-interactive
          fi
